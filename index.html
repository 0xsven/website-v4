<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sven Schmidt is a full-stack developer and software engineer.">
  <title>Sven Schmidt</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/inter-latin-400.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      color: #222;
      background: #faf8f1;
      font: 400 16px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      background: #faf8f1;
      color: #222;
    }

    .page {
      width: min(100% - 40px, 760px);
      margin-inline: auto;
    }

    h1,
    p {
      margin: 0;
      font: inherit;
    }

    h1 {
      color: #676f54;
      font-weight: 700;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      margin-top: calc(100svh / 2.61803398875);
      transform: translateY(-50%);
      font-size: clamp(18px, 3vw, 23px);
      line-height: 1.34;
      letter-spacing: -0.025em;
    }

    .intro {
      max-width: 560px;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      color: #676f54;
      font-size: 0.82em;
    }

    a {
      color: inherit;
      font: inherit;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:focus-visible {
      outline: 2px solid #222;
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 28px, 760px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Sven Schmidt</h1>
    <p class="intro">Software developer with 15 years of experience. Currently building product at <a href="https://getcartwheel.com" target="_blank" rel="noopener noreferrer">Cartwheel</a>. Open to relevant opportunities.</p>
    <nav class="contact" aria-label="Contact">
      <a href="https://www.linkedin.com/in/sven-schmidt-863308a/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="#email" data-email-link>Email</a>
    </nav>
  </main>
  <script>
    const emailLink = document.querySelector("[data-email-link]");
    const user = [104, 101, 108, 108, 111];
    const domain = [115, 118, 101, 110, 46, 105, 109];
    const decode = (part) => String.fromCharCode(...part);
    const email = `${decode(user)}@${decode(domain)}`;

    emailLink.textContent = email;
    emailLink.href = `mailto:${email}`;
  </script>
</body>
</html>
